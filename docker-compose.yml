# Local development stack: the migrations and the API, on the shared PostgreSQL container
# `local-dev-postgres-1` (the external Docker network `local-dev`, host port 5433), the same
# one ansilum-be uses. The database `streetfood` lives there.
#   cp .env.example .env   (fill PG_URL, DOCKER_PG_URL, ADMIN_API_TOKEN, ENCRYPTION_KEY, FIREBASE_PROJECT_ID)
#   docker compose up --build
# The host port can be moved if it clashes with something else: APP_PORT=18081 docker compose up --build
services:
  migrate:
    build: { context: ., target: migration }
    environment:
      PG_URL: ${DOCKER_PG_URL:?Set DOCKER_PG_URL in .env (see .env.example)}
    networks: [local-dev]
    restart: 'no'

  app:
    build: { context: ., target: production }
    env_file: .env
    environment:
      PG_URL: ${DOCKER_PG_URL:?Set DOCKER_PG_URL in .env (see .env.example)}
      REDIS_URL: ${DOCKER_REDIS_URL:-}
      HTTP_PORT: '8080'
    ports: ['127.0.0.1:${APP_PORT:-18080}:8080']
    networks: [local-dev]
    depends_on:
      migrate: { condition: service_completed_successfully }

networks:
  local-dev:
    external: true
    name: local-dev
