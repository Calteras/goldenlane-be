<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -78 868 364" width="868" height="364" role="img"><title>How often the database is touched decides the bill</title><defs></defs><rect x="-24" y="-78" width="868" height="364" fill="#ffffff"/>
<text x="0.0" y="-46.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">How often the database is touched decides the bill</text>

