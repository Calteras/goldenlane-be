<svg xmlns="http://www.w3.org/2000/svg" viewBox="-28 -58 1052 402" width="1052" height="402" role="img"><title>Target: reads and live data stay off Neon, which wakes only for real writes</title><defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect x="-28" y="-58" width="1052" height="402" fill="#ffffff"/>
<text x="-4.3" y="-26.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">Target: reads and live data stay off Neon, which wakes only for real writes</text>

<rect x="0.0" y="0.0" width="200.0" height="70.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
<rect x="300.0" y="0.0" width="300.0" height="150.0" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
