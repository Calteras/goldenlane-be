<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -58 1139 532" width="1139" height="532" role="img"><title>A GPS reading, step by step</title><defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect x="-24" y="-58" width="1139" height="532" fill="#ffffff"/>
<text x="0.0" y="-26.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">A GPS reading, step by step</text>
<line x1="151.0" y1="54" x2="151.0" y2="450.0" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>
<line x1="481.0" y1="54" x2="481.0" y2="450.0" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>
<line x1="811.0" y1="54" x2="811.0" y2="450.0" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="0.0" y="0.0" width="302.0" height="54.0" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<rect x="330.0" y="0.0" width="302.0" height="54.0" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<rect x="660.0" y="0.0" width="302.0" height="54.0" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<rect x="164.6" y="85.0" width="16.0" height="16.0" rx="8" fill="#1e293b" stroke="#1e293b" stroke-width="1"/>
<rect x="236.5" y="146.0" width="489.0" height="96.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
<rect x="210.3" y="261.0" width="16.0" height="16.0" rx="8" fill="#1e293b" stroke="#1e293b" stroke-width="1"/>
<rect x="479.0" y="323.0" width="16.0" height="16.0" rx="8" fill="#1e293b" stroke="#1e293b" stroke-width="1"/>
<rect x="530.6" y="384.0" width="560.7" height="48.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
<path d="M158.0,124.0 L474.0,124.0" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#a0)" stroke-linejoin="round"/>
<path d="M474.0,300.0 L158.0,300.0" fill="none" stroke="#475569" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#a0)" stroke-linejoin="round"/>
<path d="M488.0,362.0 L804.0,362.0" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#a0)" stroke-linejoin="round"/>
<text x="151.0" y="22.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#4c1d95" text-anchor="middle" font-weight="bold">Vendor phone</text>
<text x="151.0" y="40.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="normal">Ansilum app</text>
<text x="481.0" y="22.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1e3a8a" text-anchor="middle" font-weight="bold">POS</text>
<text x="481.0" y="40.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="normal">tracking rules</text>
<text x="811.0" y="32.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#14532d" text-anchor="middle" font-weight="bold">Customer API</text>
<text x="316.0" y="96.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="normal" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">POST location/pings: a batch of up to 100,</text>
<text x="316.0" y="112.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="normal" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">every 15 to 120 s, queued while offline</text>
<text x="172.6" y="97.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
<text x="481.0" y="166.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="normal">1. judge every reading on its own (one bad reading never discards the batch)</text>
<text x="481.0" y="182.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="normal">2. store all accepted readings in the trail (owner's reports)</text>
<text x="481.0" y="198.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="normal">3. current position = newest trusted reading</text>
<text x="481.0" y="214.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="normal">4. decide whether to publish it (the throttle: 15 s and 20 m)</text>
<text x="481.0" y="230.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="normal">5. answer the phone how often to send next</text>
<text x="316.0" y="272.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="normal" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">accepted, flagged, rejected,</text>
<text x="316.0" y="288.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="normal" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">nextIntervalSeconds</text>
<text x="218.3" y="273.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
<text x="646.0" y="334.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="normal" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">event outlet.location.updated, only if the throttle</text>
<text x="646.0" y="350.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="normal" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">allows (signed batch)</text>
<text x="487.0" y="335.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
<text x="811.0" y="404.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="normal">stores the position if it is newer than the current one, then recomputes where customers</text>
<text x="811.0" y="420.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="normal">find the outlet</text>
</svg>
