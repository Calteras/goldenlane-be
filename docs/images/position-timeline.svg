<text x="60.0" y="22.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#4c1d95" text-anchor="middle" font-weight="bold">t = 0.0 s</text>
<text x="154.0" y="22.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1e293b" text-anchor="start" font-weight="normal">The vendor's phone sends a reading; the POS judges and stores it</text>
<text x="60.0" y="80.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1e3a8a" text-anchor="middle" font-weight="bold">t = 0.0 s</text>
<text x="154.0" y="80.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1e293b" text-anchor="start" font-weight="normal">POS: at least 15 s since the last publication and moved 20 m or more: it writes the outbox event</text>
<text x="60.0" y="138.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1e3a8a" text-anchor="middle" font-weight="bold">t ≤ 5 s</text>
<text x="154.0" y="138.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1e293b" text-anchor="start" font-weight="normal">The POS worker picks it up and POSTs the signed batch</text>
<text x="60.0" y="196.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#14532d" text-anchor="middle" font-weight="bold">t + ~50 ms</text>
<text x="154.0" y="196.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1e293b" text-anchor="start" font-weight="normal">The customer API verifies it, stores it in the inbox and answers 204</text>
<text x="60.0" y="254.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#14532d" text-anchor="middle" font-weight="bold">t ≤ 1 s</text>
<text x="154.0" y="254.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1e293b" text-anchor="start" font-weight="normal">The customer API's worker applies it: pos_lat and pos_lng are updated</text>
<text x="60.0" y="312.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#7c2d12" text-anchor="middle" font-weight="bold">next request</text>
<text x="154.0" y="312.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1e293b" text-anchor="start" font-weight="normal">GET /v1/outlets/nearby shows the new position</text>
<text x="420.0" y="352.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="normal" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">A customer sees a moving cart a few seconds behind the vendor: updated at most every 15 s, and only when the cart moved.</text>
</svg>
