<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -58 888 438" width="888" height="438" role="img"><title>One position's journey, with time</title><defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect x="-24" y="-58" width="888" height="438" fill="#ffffff"/>
